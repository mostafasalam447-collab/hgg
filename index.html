var act='m',ST={};
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function byN(n){for(var i=0;i<ALL.length;i++)if(ALL[i].n==n)return ALL[i];return null}
function opts(q){return q.type==='match'?NSTM:q.o}
function ctext(q){return L[q.c]+') '+opts(q)[q.c]}
function buildPanels(){
  var tb='',pn='';
  TABS.forEach(function(t){
    ST[t.k]={res:{},qs:ALL.filter(function(q){return q.s===t.k})};
    tb+='<button type="button" class="tab" data-tab="'+t.k+'">'+t.label+'<small>'+ST[t.k].qs.length+' سؤال</small></button>';
    pn+='<section class="panel" id="p_'+t.k+'"><div id="cards_'+t.k+'"></div>'+
      '<button class="btn sbtn" data-sub="'+t.k+'" id="sub_'+t.k+'" disabled>عرض نتيجة القسم 🎯</button>'+
      '<div class="resbox" id="result_'+t.k+'" style="display:none"></div></section>';
  });
  $('tabs').innerHTML=tb;$('panels').innerHTML=pn;
  TABS.forEach(function(t){renderCards(t.k)});
}
function renderCards(k){
  var h='',last='';
  ST[k].qs.forEach(function(q){
    if(q.sec!==last){last=q.sec;h+='<div class="sec">'+esc(SECS[q.sec].title)+'</div>';}
    h+='<div class="card" id="c'+q.n+'"><div class="qh"><span class="qn">'+esc(q.num)+'</span><span class="tag">'+esc(SECS[q.sec].tag)+'</span></div>';
    h+='<div class="qt">'+esc(q.q)+'</div>';
    if(q.type==='match'){
      h+='<div class="hint">اختر التعريف الصحيح لهذا المصطلح</div><select class="inp" id="sel'+q.n+'"><option value="">— اختر —</option>'+NSTM.map(function(s,i){return '<option value="'+i+'">'+L[i]+'. '+esc(s)+'</option>'}).join('')+'</select>';
      h+='<div class="btns"><button type="button" class="btn" data-act="mcheck" data-n="'+q.n+'">تحقق ✔</button></div>';
    }else{
      h+='<div class="opts">';
      q.o.forEach(function(o,i){h+='<button type="button" class="opt" data-act="opt" data-n="'+q.n+'" data-i="'+i+'"><b>'+L[i]+'</b><span>'+esc(o)+'</span></button>'});
      h+='</div>';
    }
    h+='<div class="fb" id="fb'+q.n+'"></div></div>';
  });
  $('cards_'+k).innerHTML=h;
}
function updateBar(){
  var s=ST[act],total=s.qs.length,done=0,c=0;
  for(var x in s.res){done++;if(s.res[x])c++;}
  $('sNum').textContent=done+'/'+total;$('sC').textContent='✅ '+c;$('sW').textContent='❌ '+(done-c);
  $('sP').textContent='📊 '+(done?Math.round(c/done*100):0)+'%';
  $('sFill').style.width=(total?done/total*100:0)+'%';
  $('sub_'+act).disabled=done<1;
}
function setTab(k,noScroll){
  act=k;
  var ts=document.querySelectorAll('.tab');
  for(var i=0;i<ts.length;i++)ts[i].classList.toggle('on',ts[i].getAttribute('data-tab')===k);
  TABS.forEach(function(t){var p=$('p_'+t.k);if(t.k===k)p.classList.add('on');else p.classList.remove('on')});
  updateBar();
  if(!noScroll)window.scrollTo(0,0);
}
function move(d){
  var i=0;TABS.forEach(function(t,j){if(t.k===act)i=j});
  var j=i+d;if(j<0||j>=TABS.length)return;
  setTab(TABS[j].k);
}
function answer(q,i,ok){
  var s=ST[q.s];s.res[q.n]=ok;
  var card=$('c'+q.n);card.className='card '+(ok?'ok':'no');
  var fb=$('fb'+q.n);fb.className='fb '+(ok?'ok':'no');fb.style.display='block';
  fb.innerHTML=(ok?'✅ إجابة صحيحة!':'❌ الإجابة الصحيحة: <b dir="ltr">'+esc(ctext(q))+'</b>')+(q.exp?'<div dir="rtl" style="margin-top:6px">'+esc(q.exp)+'</div>':'');
  updateBar();
}
function showResults(k){
  var s=ST[k],done=0,c=0;
  s.qs.forEach(function(q){if(s.res[q.n]!==undefined){done++;if(s.res[q.n])c++;}});
  var p=done?Math.round(c/done*100):0,left=s.qs.length-done;
  var msg=(p>=90?'ممتاز! مستواك رائع 🌟':p>=75?'جيد جداً، كمّل كده 👏':p>=50?'مستوى كويس، راجع الأخطاء وهتتحسن 💪':'محتاج مراجعة أكتر، ذاكر وجرّب تاني 📚')+(left?'  (لسه فاضل '+left+' سؤال بدون إجابة)':'');
  var h='<div id="result" style="display:block"><h2>🎉 النتيجة</h2><div class="big">'+c+' / '+done+'</div><div>'+msg+'</div>';
  h+='<div class="stats"><div class="stat c">✅ صح<br>'+c+'</div><div class="stat w">❌ غلط<br>'+(done-c)+'</div><div class="stat p">📊 النسبة<br>'+p+'%</div></div>';
  h+='<div class="btns" style="justify-content:center"><button class="btn" data-again="'+k+'">🔄 إعادة القسم</button><button class="btn gh" data-top="1">🏠 للأعلى</button></div>';
  var wr=s.qs.filter(function(q){return s.res[q.n]===false});
  h+='<div class="rev">'+(wr.length?'<h3>📝 مراجعة الأسئلة الغلط ('+wr.length+')</h3>'+wr.map(function(q){return '<div class="ri"><div class="q">'+esc(SECS[q.sec].tag)+' — Q'+esc(q.num)+': '+esc(q.q)+'</div><div>✅ <b dir="ltr">'+esc(ctext(q))+'</b></div></div>'}).join(''):'<h3>🎯 كل إجاباتك صح!</h3>')+'</div></div>';
  var box=$('result_'+k);box.innerHTML=h;box.style.display='block';box.scrollIntoView();
}
function resetTab(k){
  ST[k].res={};renderCards(k);$('result_'+k).style.display='none';updateBar();window.scrollTo(0,0);
}
function onClick(e){
  var b=e.target;
  while(b&&b!==document&&!(b.getAttribute&&(b.getAttribute('data-act')||b.getAttribute('data-tab')||b.getAttribute('data-sub')||b.getAttribute('data-again')||b.getAttribute('data-top'))))b=b.parentNode;
  if(!b||b===document)return;
  var t=b.getAttribute('data-tab');if(t){setTab(t);return}
  var sb=b.getAttribute('data-sub');if(sb){showResults(sb);return}
  var ag=b.getAttribute('data-again');if(ag){resetTab(ag);return}
  if(b.getAttribute('data-top')){window.scrollTo(0,0);return}
  var q=byN(b.getAttribute('data-n'));
  if(!q||ST[q.s].res[q.n]!==undefined)return;
  var act2=b.getAttribute('data-act');
  if(act2==='opt'){
    var i=+b.getAttribute('data-i'),bs=$('c'+q.n).querySelectorAll('.opt');
    for(var j=0;j<bs.length;j++){var x=+bs[j].getAttribute('data-i');if(x===q.c)bs[j].classList.add('right');else if(x===i)bs[j].classList.add('bad');bs[j].disabled=true;}
    answer(q,i,i===q.c);
  }else if(act2==='mcheck'){
    var sl=$('sel'+q.n);if(!sl.value)return;
    var ok=(+sl.value===q.c);sl.className='inp '+(ok?'ok':'no');sl.disabled=true;b.disabled=true;answer(q,+sl.value,ok);
  }
}
var tx=0,ty=0,tt=0,tok=false;
function ts(e){var t=e.changedTouches[0];tx=t.clientX;ty=t.clientY;tt=Date.now();var n=e.target&&e.target.tagName;tok=!(n==='SELECT'||n==='INPUT'||n==='OPTION')}
function te(e){
  if(!tok)return;var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy)&&Date.now()-tt<900)move(dx<0?1:-1);
}
function init(){
  buildPanels();
  document.addEventListener('click',onClick);
  document.addEventListener('touchstart',ts,{passive:true});
  document.addEventListener('touchend',te,{passive:true});
  document.addEventListener('keydown',function(e){var n=e.target&&e.target.tagName;if(n==='INPUT'||n==='SELECT')return;if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1)});
  setTab('m',true);
}
init();
</script>
